# meadows-web front-end host. Also usable standalone instead of the hosted one:
#
#   docker run -d -p 8081:8081 \
#     -e MEADOWS_SERVER_URL=http://chat.example.com remcoboerma/meadows-web
#
# MEADOWS_SERVER_URL is injected into index.html at container start (the image
# CMD runs `python -m meadows.web.build` first); the browser then opens its own
# Socket.IO connection straight to that URL.
networks:
  meadows:
    driver: bridge
  broker:
    external: true
    name: broker

services:
  meadows-web:
    # Context is the repo root: pyproject.toml's [tool.uv.sources] points at
    # ../meadows-protocol, so the sibling must be part of the build context
    # (see Dockerfile).
    build:
      context: ..
      dockerfile: meadows-web/Dockerfile
    image: remcoboerma/meadows-web
    restart: unless-stopped
    environment:
      - MEADOWS_WEB_HOST=${MEADOWS_WEB_HOST:-0.0.0.0}
      - MEADOWS_WEB_PORT=${MEADOWS_WEB_PORT:-8081}
      - MEADOWS_SERVER_URL=${MEADOWS_SERVER_URL:-http://localhost:8080}
      - MEADOWS_SYSTEM_NAME=${MEADOWS_SYSTEM_NAME:-MEADOWS Chat}
      - PROJECT=${PROJECT:-meadows}
      - HOSTINGDOMAIN=${HOSTINGDOMAIN:-localhost}
    networks:
      - meadows
      - broker
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT:-meadows}-meadows-web-secure.rule=Host(`${ROUTER_HOST:-chat.${HOSTINGDOMAIN:-localhost}}`)"
      - "traefik.http.routers.${PROJECT:-meadows}-meadows-web-secure.tls=true"
      - "traefik.http.routers.${PROJECT:-meadows}-meadows-web-secure.entrypoints=web-secured"
      - "traefik.http.routers.${PROJECT:-meadows}-meadows-web-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.${PROJECT:-meadows}-meadows-web.loadbalancer.server.port=${MEADOWS_WEB_PORT:-8081}"
      - "traefik.docker.network=broker"
